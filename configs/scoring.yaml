# Candle vs APR Scoring Contract v1.0.0
#
# Adapted from qwen-coder-deploy/docs/specifications/scoring.yaml v3.0.0.
# Quantitative grading for Candle vs realizr Rust-vs-Rust comparison.
#
# Tool: probador llm score --results results/ --contract configs/scoring.yaml
# Data: probador llm load --stream false --max-tokens 256 --num-layers 28

metadata:
  version: "1.0.0"
  created: "2026-04-02"
  author: "PAIML Engineering"
  model: "Qwen2.5-Coder-1.5B-Instruct (Q4_K_M, 1.5B params, 28 layers)"
  tool: "probador llm score"
  data_source: "probador llm load --stream false --max-tokens 256"
  methodology: "30s duration, 5s warmup, locked GPU 2520 MHz, RTX 4090"
  parent_spec: "qwen-coder-deploy/docs/specifications/scoring.yaml v3.0.0"

# Thresholds adapted from qcd v3.0.0 (yoga RTX 4060L → Lambda RTX 4090)
# RTX 4090 has ~4x the compute of 4060L, so thresholds scaled accordingly.
thresholds:
  decode_tok_s:    { excellent: 250, good: 150, direction: "higher_is_better" }
  ttft_p50_ms:     { excellent: 10,  good: 50,  direction: "lower_is_better" }
  itl_p50_ms:      { excellent: 5.0, good: 15,  direction: "lower_is_better" }
  ttft_p99_ms:     { excellent: 15,  good: 60,  direction: "lower_is_better" }
  error_rate:      { excellent: 0.0, good: 0.01, direction: "lower_is_better" }
  us_per_layer:    { excellent: 150, good: 500, direction: "lower_is_better" }

weights:
  interactive:  # c=1 (primary comparison — Candle has no server)
    decode_tok_s:   0.30
    ttft_p50_ms:    0.25
    itl_p50_ms:     0.20
    us_per_layer:   0.15
    error_rate:     0.10

